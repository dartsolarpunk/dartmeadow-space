<!doctype html>
<!-- DMVLight shader harness: builds + renders the REAL fogNode (ui/dm-vlight.js) on a night terrain with a wall, a flashlight spot and two lamps, so a TSL graph error or a
     GPU compile error shows up without the whole game.  Software GL / SwiftShader is enough (no fps meaning).  Query: ?gl=1 (WebGL2 backend) ?flash=0|1 ?lamps=0|1 ?side=1 (camera beside the beam) ?vlights=0|low|med|high ?sun=1 (low sun)
     Result: window.__done = { ok, status, err[], px } ; the canvas is the picture. -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js"}}</script>
<script>window.__err = []; addEventListener('error', e => __err.push(String(e.message)));</script>
<script src="../../ui/dm-vlight.js"></script>
</head><body>

  const g = new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2); scene.add(new THREE.Mesh(g, new THREE.MeshStandardNodeMaterial({ color: 0x4a4a3c, roughness: 0.95 })));

</script></body></html>
