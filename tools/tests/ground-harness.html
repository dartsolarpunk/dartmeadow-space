<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id=c width=960 height=540></canvas>
<script type="importmap">{"imports":{"three":"/three/build/three.webgpu.js","three/webgpu":"/three/build/three.webgpu.js","three/tsl":"/three/build/three.tsl.js"}}</script>
<script type="module">
// Headless render of the REAL _terrainDetailMat (extracted from index.html) with the ground library on a flat plane, a shoe-sized reference box and a 3.26-unit figure.
// ?style=lush|dunes|mesa|ice|volcanic|crater &seed=N &view=wide|close|low &tier=ultra|high|medium|low &mob=1 &wet=1 (force puddles) &px=0 (library off)
import * as TH from 'three/webgpu'; import * as TSL from 'three/tsl';
const Q=new URLSearchParams(location.search), q=(k,d)=>Q.get(k)??d;
const THREE=Object.assign({},TH); THREE.TSL=TSL; window.THREE=THREE; Object.assign(window,TSL);
window.__GDBG=q('dbg',null);
window.GFX={isMobile:q('mob')==='1'};
window.resolvePreset=()=>q('tier','ultra');
const style=q('style','lush'), seed=+q('seed',1234);
window.TERRAIN={style,sandy:style==='dunes',pal:{water:style==='lush',ground:0x3a7d34},sun:{position:new TH.Vector3(8,5,3),target:{position:new TH.Vector3()}}};
window.TESS_HOLE={slots:[]};
window._pwfReady=()=>false;
window.DMWorldStyle={};
await import('../../ui/dm-parallax.js'); await import('../../ui/dm-groundlib.js');
// pull the real function out of index.html
const src=await (await fetch('../../index.html')).text();
const a=src.indexOf('function _terrainDetailMat(opts){'), b=src.indexOf('\n}\n',a)+3;
const fn=new Function('THREE','TERRAIN','TESS_HOLE','resolvePreset','_pwfReady','window',src.slice(a,b)+'\nreturn _terrainDetailMat;')(THREE,window.TERRAIN,window.TESS_HOLE,window.resolvePreset,window._pwfReady,window);
const r=new TH.WebGPURenderer({canvas:document.getElementById('c'),forceWebGL:true,antialias:false}); await r.init(); if(q('sky')==='1'){ }
window.backend=r.backend.constructor.name;
const sc=new TH.Scene(); sc.background=new TH.Color(0x9ec0e0); sc.fog=new TH.Fog(0x9ec0e0,80,400);
const view=q('view','wide');
const cam=new TH.PerspectiveCamera(50,960/540,0.05,800);
sc.add(new TH.HemisphereLight(0xbfd8ff,0x504838,0.9)); const sun=new TH.DirectionalLight(0xfff0d0,2.6); sun.position.set(8,5,3); sc.add(sun);
// ground: plane with a vertex colour per style (a stand-in for surfaceBiomeColor)
const col={lush:[0.30,0.42,0.20],dunes:[0.78,0.66,0.46],mesa:[0.66,0.36,0.22],ice:[0.9,0.94,1.0],volcanic:[0.22,0.2,0.2],crater:[0.5,0.48,0.46]}[style]||[0.5,0.5,0.4];
const g=new TH.PlaneGeometry(600,600,2,2); g.rotateX(-Math.PI/2); const n=g.attributes.position.count, ca=new Float32Array(n*3); for(let i=0;i<n;i++){ca[i*3]=col[0];ca[i*3+1]=col[1];ca[i*3+2]=col[2];} g.setAttribute('color',new TH.BufferAttribute(ca,3));
let prof=null, bakeMs=0;
if(q('px')!=='0'){ prof=window.DMGround.beginWorld({style,seed,water:style==='lush'}); const t0=performance.now(); while(window.DMGround.pump(1e9)); bakeMs=performance.now()-t0; }
if(q('wet')==='1'&&window.DMGround._S.tex){ const rg=window.DMGround._S.tex.region; for(let i=0;i<rg.length;i+=4){ rg[i+2]=Math.max(rg[i+2],170); } window.DMGround._S.tex.tr.needsUpdate=true; }
if(q('ruin')==='1'&&window.DMGround._S.tex){ const rg=window.DMGround._S.tex.region; for(let i=0;i<rg.length;i+=4){ rg[i+3]=255; } window.DMGround._S.tex.tr.needsUpdate=true; }
if(q('band')!==null&&window.DMGround._S.tex){ const rg=window.DMGround._S.tex.region, bnd=+q('band'); for(let i=0;i<rg.length;i+=4){ rg[i]=Math.round((bnd+0.3)/6*255); } window.DMGround._S.tex.tr.needsUpdate=true; }
const m=fn({}); const ground=new TH.Mesh(g,m); ground.position.y=0; sc.add(ground);
window.ok=!!(m.userData&&m.userData.dmGround);
// scale references: a shoe (0.48 x 0.14 x 0.18 u) and a 3.26 u figure
const shoe=new TH.Mesh(new TH.BoxGeometry(0.48,0.16,0.18),new TH.MeshStandardMaterial({color:0xc03030,roughness:0.6})); shoe.position.set(0,0.08,0); sc.add(shoe);
const fig=new TH.Mesh(new TH.CapsuleGeometry(0.28,2.4,4,10),new TH.MeshStandardMaterial({color:0x335577,roughness:0.7})); fig.position.set(-0.9,1.63,0.3); if(view!=='top') sc.add(fig);
if(view==='wide'){ cam.position.set(2.4,3.6,7.5); cam.lookAt(0,0.9,-2); }
else if(view==='close'){ cam.position.set(1.0,1.5,2.4); cam.lookAt(0.2,0,0); }
else if(view==='low'){ cam.position.set(1.4,0.55,2.2); cam.lookAt(0,0.05,-3); }
else if(view==='top'){ cam.position.set(0,3.2,0.01); cam.lookAt(0,0,0); }
else if(view==='far'){ cam.position.set(20,12,40); cam.lookAt(0,0,-30); }
let t0=performance.now(); await r.compileAsync(sc,cam); window.compileMs=performance.now()-t0;
if(window.DMParallax._S.U){ window.DMParallax._S.U.steps.value=+q('steps',window.DMParallax._S.U.steps.value); }
t0=performance.now(); for(let i=0;i<3;i++) await r.renderAsync(sc,cam); window.frameMs=(performance.now()-t0)/3;
window.prof=prof&&prof.names; window.bakeMs=bakeMs; window.status=window.DMParallax.status(); window.gstatus=window.DMGround.status();
if(window.DMGround._S.U){ window.DMGround._S.U.skyAmt.value=1; await r.renderAsync(sc,cam); }
window.done=true;
</script>
