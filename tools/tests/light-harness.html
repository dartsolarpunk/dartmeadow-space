<!doctype html>
<!-- DMLight shader harness (v297): builds + renders the real DMLight material hooks (applyMaterial / sunVisNode) on a displaced terrain with a wall, so a TSL graph
     error or a GPU compile error shows up without the whole game.  Software GL / SwiftShader is enough (no fps meaning).  Query: ?gl=1 (WebGL2 backend),
     ?light=off|low|med|high|ultra, ?far=1 (camera high above a 2 km plane: the window masking is what keeps far terrain free of phantom shadows).
     Result: window.__done = { ok, status, err[] } ; the canvas is the picture. -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js"}}</script>
<script>window.__err = []; addEventListener('error', e => __err.push(String(e.message))); window.GFX = { isMobile: false, gpuClass: 'high', preset: 'ultra' }; window.PW = { gen: 1, scene: null }; window.TERRAIN = {};</script>
<script src="../../ui/dm-light.js"></script>
</head><body>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE; const T = THREE.TSL, Q = new URLSearchParams(location.search), far = Q.get('far') === '1';
const _ce = console.error; console.error = (...a) => { __err.push(a.map(String).join(' ').slice(0, 300)); _ce(...a); };
try {
  const r = new THREE.WebGPURenderer({ antialias: false, forceWebGL: Q.get('gl') === '1' }); r.setSize(384, 256); r.shadowMap.enabled = true; document.body.appendChild(r.domElement); await r.init();
  window.flightRenderer = r;
  const H = (x, z) => 4 * Math.sin(x * 0.03) * Math.cos(z * 0.035) + (x > 10 && x < 16 && z > -30 && z < 30 ? 12 : 0);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8ab4e0); PW.scene = scene;
  const cam = new THREE.PerspectiveCamera(60, 384 / 256, 0.5, 5000);
  if (far) { cam.position.set(0, 220, 380); cam.lookAt(0, 0, -400); } else { cam.position.set(-30, 18, 34); cam.lookAt(10, 2, 0); }
  const S = far ? 2000 : 240, seg = far ? 400 : 240, g = new THREE.PlaneGeometry(S, S, seg, seg); g.rotateX(-Math.PI / 2);
  const pa = g.attributes.position; for (let i = 0; i < pa.count; i++) pa.setY(i, H(pa.getX(i), pa.getZ(i))); g.computeVertexNormals();
  const mat = new THREE.MeshStandardNodeMaterial({ color: 0x9a8a70, roughness: 0.95 });
  const ground = new THREE.Mesh(g, mat); ground.receiveShadow = true; ground.castShadow = true; scene.add(ground);
  const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x403020, 0.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(60, 40, 20); sun.castShadow = true; sun.shadow.mapSize.set(512, 512); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 300 }); scene.add(sun, sun.target);
  TERRAIN.sun = sun; const sunDir = sun.position.clone().normalize();
  const o = { x: 0, y: H(0, 0) + 2, z: 0, H, sunDir, day: 1, scene, renderer: r, walk: true };
  for (let f = 0; f < 3; f++) DMLight.tick(1 / 60, o);
  const applied = DMLight.applyMaterial(mat, { p: T.positionWorld });
  // a second, water-like material through sunVisNode (the sea hook)
  const sv = DMLight.sunVisNode(T.positionWorld), wm = new THREE.MeshBasicNodeMaterial(); wm.colorNode = sv ? T.vec3(0.1, 0.3, 0.5).mul(sv) : T.vec3(0.1, 0.3, 0.5);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), wm); sea.position.set(-25, -1, -20); scene.add(sea);
  for (let f = 0; f < 90; f++) { DMLight.tick(1 / 60, o); r.render(scene, cam); if (f % 10 === 0) await new Promise(res => setTimeout(res, 0)); }
  await new Promise(res => requestAnimationFrame(res)); r.render(scene, cam);
  window.__done = { ok: true, applied, seaNode: !!sv, status: DMLight.status(), err: __err };
} catch (e) { __err.push('harness: ' + (e && e.stack || e)); window.__done = { ok: false, err: __err, status: window.DMLight && DMLight.status() }; }
</script></body></html>
