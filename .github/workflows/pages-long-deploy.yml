# Start a GitHub Pages deploy and do not cancel it.
# actions/deploy-pages caps its wait at 10 minutes and then cancels a
# still-running sync, which has been aborting publishes of this site.
name: Deploy Pages (long timeout)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Optional Actions run that already uploaded a github-pages artifact
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-long-deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://dartmeadow.space/
    steps:
      - name: Start Pages deployment without canceling it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -n 1)
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "No github-pages artifact on run ${ARTIFACT_RUN_ID}" >&2
            exit 1
          fi
          echo "Using github-pages artifact ${ARTIFACT_ID} from run ${ARTIFACT_RUN_ID}"
          ID_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            -H "Content-Type: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [ -z "${ID_TOKEN}" ] || [ "${ID_TOKEN}" = "null" ]; then
            echo "Failed to get an OIDC token" >&2
            exit 1
          fi
          jq -n \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${ID_TOKEN}" \
            '{artifact_id:$artifact_id, pages_build_version:$pages_build_version, oidc_token:$oidc_token}' \
            > /tmp/pages-deploy.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input /tmp/pages-deploy.json \
            | tee /tmp/pages-deploy-result.json
          rm -f /tmp/pages-deploy.json
          echo "Started Pages deployment and left it running (will not cancel on a 10-minute wait)."
